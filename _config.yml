# Setup
title: 七千气清
url: https://blog.co6co.top
paginate: 1
baseurl: ""
permalink: pretty
future: true


# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# ga_analytics: UA-000000-0

# Specify the author for blog posts
author:
  name: co6co
  url: https://blog.co6co.top
  email: co6co@xx.com

# Custom vars
version: 3.0.0

# Navbar page list
nav:
  - title: Blog
    url: /views/article
  - title: 分类
    url: /views/categories
  - title: 标签
    url: /views/tags
  - title: 安全相关
    url: /views/aq
  - title: 测试
    url: /views/test
  - title: old
    url: /views/old
  - title: 关于
    url: /views/about
# 帖子
collections:
  new:
    output: true # Jekyll 会为集合中的每个文档生成一个单独的页面
    permalink: /tip/:path/
  article:
    output: true # Jekyll 会为集合中的每个文档生成一个单独的页面
    permalink: /article/:path/ 
  aq:
    output: true
    permalink: /aq/:path/
  old:
    output: true
    permalink: /aq/:path/
  test:
    output: true
    permalink: /test/:path/



