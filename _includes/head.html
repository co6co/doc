<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<!-- ICO文件,兼容旧版浏览器 -->
	<link
		rel="shortcut icon"
		href="{{'/assets/favicon.ico' | relative_url}}"
		type="image/x-icon" />
	<link
		rel="icon"
		type="image/png"
		sizes="16x16"
		href="{{'/assets/favicon-16x16.ico' | relative_url}}" />
	<link
		rel="icon"
		type="image/png"
		sizes="32x32"
		href="{{'/assets/favicon-32x32.icon' | relative_url}}" />
	<link
		rel="icon"
		type="image/png"
		sizes="64x64"
		href="{{'/assets/favicon-64x64.icon' | relative_url}}" />
	<link
		rel="icon"
		type="image/png"
		sizes="128x128"
		href="{{'/assets/favicon-128x128.icon' | relative_url}}" />
	<link
		rel="icon"
		type="image/png"
		sizes="128x128"
		href="{{'/assets/favicon-256x256.icon' | relative_url}}" />

	<title>{{ page.title }} &middot; {{ site.title }}</title>

	<link rel="stylesheet" href="{{ '/assets/css/index.css' | relative_url }}" />

	<link
		rel="alternate"
		type="application/atom+xml"
		title="{{ site.title }}"
		href="{{ 'atom.xml' | relative_url }}" />

	{% seo title=false %}
	<meta name="keywords" content="{{site.keywords}}" />
	<meta
		name="description"
		content="{{ page.excerpt | xml_escape ||site.description}}" />
</head>
