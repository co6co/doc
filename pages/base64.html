<div class="box">
	<textarea id="content" cols="65" rows="15" placeholder="明文"></textarea>
	<div class="btn-box">
		<select id="type">
			<option value="0">Base64 ASCII</option>
			<option value="1">Base64</option>
			<!--<option value="uri">URI</option>
                <option value="url">URL</option>-->
		</select>
		<button id="encryptbtn">Encrypt&gt;&gt;</button>
		<button id="decryptbtn">Decrypt&lt;&lt;</button>
	</div>
	<textarea id="encontent" cols="65" rows="15" placeholder="密文"></textarea>
</div>
<script>
	const encryptBtn = document.getElementById('encryptbtn');
	const decryptBtn = document.getElementById('decryptbtn');
	const contentEle = document.getElementById('content');
	const encontentEle = document.getElementById('encontent');
	const typeEle = document.getElementById('type');
	const encode = function (content) {
		const type = typeEle.value;
		if (type == '0') {
			return Base64.btoa(content);
		} else if (type == '1') {
			return Base64.encode(content);
		} else if (type == 'uri') {
			return Base64.encodeURI(content);
		} else if (type == 'url') {
			return Base64.encodeURL(content);
		}
	};
	const decode = function (content) {
		const type = typeEle.value;
		if (type == '0') {
			return Base64.decode(content);
		} else if (type == '1') {
			return Base64.decode(content);
		} else if (type == 'uri') {
			// return Base64.toUint8Array(content);
			return Base64.decode(content);
		} else if (type == 'url') {
			return Base64.decode(content);
		}
	};
	encryptBtn.addEventListener('click', () => {
		const content = contentEle.value;
		encontentEle.value = encode(content);
	});
	decryptBtn.addEventListener('click', () => {
		const content = encontentEle.value;
		contentEle.value = decode(content);
	});
</script>
